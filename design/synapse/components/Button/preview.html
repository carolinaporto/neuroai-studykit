<!-- @dsCard group="Foundations" height=110 subtitle="Primary, secondary, danger and disabled" -->
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=IBM+Plex+Sans:wght@400;500;600&display=swap">
<style>
  .bt-wrap { display:flex; gap: var(--space-3); justify-content:center; align-items:center; flex-wrap:wrap; padding: var(--space-6) var(--space-4); font-family: var(--font-sans); }
  .bt { all:unset; box-sizing:border-box; padding: var(--space-2) var(--space-4); border-radius: var(--radius-md); cursor:pointer; }
  .bt.primary { background: var(--accent-neuro); color: var(--on-fill); }
  .bt.secondary { background: transparent; border: 1px solid var(--border-strong); color: var(--ink); }
  .bt.danger { background: var(--danger); color: var(--on-fill); }
  .bt.disabled { background: var(--surface-200); color: var(--ink-soft); cursor:not-allowed; }
  .bt:focus-visible { outline: 2px solid var(--focus-ring); outline-offset: 2px; }
</style>
<div class="bt-wrap">
  <button class="bt primary button">Start quiz</button>
  <button class="bt secondary button">Review answers</button>
  <button class="bt danger button">Delete note</button>
  <button class="bt disabled button" disabled>Locked</button>
</div>

<style>

<!--

  arrangement: one tall accent-neuro slab (the system's most-repeated interactive hue) with three satellites stacked beside it; accent-warm leads the satellite row because it is the identity-defining "Harvard, quietly" hue even though the UI spends it sparingly
  pattern: a literal motif — nodes and synaptic connections cut in surface-50 out of the accent-neuro slab, the same node-and-line mark used as the SiteNav brand glyph, standing in for the name itself
  scales: gaps at space-5 (24px); slab width space-8×3 (192px); satellite row heights space-8×2 (128px) and the 288px remainder (136px); node radii and stroke drawn from radius-sm/radius-md
-->

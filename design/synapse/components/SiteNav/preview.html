<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Newsreader:wght@400;500;600&family=IBM+Plex+Sans:wght@400;500;600&family=IBM+Plex+Mono:wght@400;500&display=swap">
<style>
  .synav-wrap { display:flex; justify-content:center; padding: var(--space-6) 0; font-family: var(--font-sans); }
  .synav { width:264px; background: var(--surface-100); border-radius: var(--radius-lg); box-shadow: var(--shadow-sm); padding: var(--space-4); box-sizing: border-box; }
  .synav-brand { display:flex; align-items:center; gap: var(--space-2); }
  .synav-mark circle { fill: var(--accent-neuro); }
  .synav-mark circle.dim { fill: var(--accent-neuro-soft); }
  .synav-mark line { stroke: var(--accent-neuro); stroke-width: 1.4; opacity: .55; }
  .synav-name { font-family: var(--font-serif); font-weight: 600; font-size: 19px; color: var(--ink); letter-spacing: -0.01em; }
  .synav-sub { margin: 2px 0 var(--space-4) 30px; color: var(--ink-soft); }
  .synav-list { display:flex; flex-direction:column; gap: 2px; list-style:none; margin:0; padding:0; }
  .synav-item { all:unset; display:flex; align-items:center; gap: var(--space-3); width:100%; box-sizing:border-box; padding: var(--space-3); border-radius: var(--radius-md); color: var(--ink); cursor: pointer; }
  .synav-item .icon { width:18px; height:18px; flex-shrink:0; color: var(--ink-soft); }
  .synav-item .label { flex:1; text-transform: uppercase; }
  .synav-item.is-active { background: var(--accent-neuro-soft); color: var(--accent-neuro); }
  .synav-item.is-active .icon { color: var(--accent-neuro); }
  .synav-item.is-locked { color: var(--ink-soft); cursor: not-allowed; }
  .synav-item .lock { width:14px; height:14px; flex-shrink:0; color: var(--ink-soft); }
  .synav-item .pub { background: var(--accent-warm-soft); color: var(--accent-warm); padding: 2px var(--space-2); border-radius: var(--radius-pill); }
  .synav-foot { margin-top: var(--space-4); padding-top: var(--space-3); border-top: 1px solid var(--border-subtle); }
  .synav-signin { all:unset; box-sizing:border-box; display:block; width:100%; text-align:center; background: var(--surface-100); border: 1px solid var(--border-strong); border-radius: var(--radius-md); padding: var(--space-2) var(--space-3); color: var(--ink); cursor:pointer; }
  .synav-signin:focus-visible, .synav-item:focus-visible { outline: 2px solid var(--focus-ring); outline-offset: 2px; }
</style>
<div class="synav-wrap">
  <div class="synav">
    <div class="synav-brand">
      <svg class="synav-mark" width="22" height="22" viewBox="0 0 24 24">
        <line x1="6" y1="7" x2="18" y2="17"/><line x1="6" y1="17" x2="18" y2="7"/><line x1="12" y1="12" x2="12" y2="12"/>
        <circle cx="6" cy="7" r="2.5"/><circle cx="18" cy="7" r="2.5" class="dim"/>
        <circle cx="6" cy="17" r="2.5" class="dim"/><circle cx="18" cy="17" r="2.5"/>
      </svg>
      <span class="synav-name">Synapse</span>
    </div>
    <div class="synav-sub caption">Foundations of Neuro AI</div>

    <nav class="synav-list">
      <button class="synav-item is-active">
        <svg class="icon" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round"><path d="M4 11.5 12 4l8 7.5"/><path d="M6 10.5V20h12v-9.5"/></svg>
        <span class="label">Overview</span>
      </button>
      <button class="synav-item is-locked" disabled>
        <svg class="icon" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round"><rect x="4" y="4" width="16" height="16" rx="2"/><path d="M9 4v16"/></svg>
        <span class="label">Sources</span>
        <svg class="lock" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.6" stroke-linecap="round" stroke-linejoin="round"><rect x="6" y="10" width="12" height="9" rx="1.5"/><path d="M9 10V7a3 3 0 0 1 6 0v3"/></svg>
      </button>
      <button class="synav-item is-locked" disabled>
        <svg class="icon" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round"><circle cx="12" cy="12" r="8"/><path d="M9 12.5l2 2 4-4.5"/></svg>
        <span class="label">Quizzes</span>
        <svg class="lock" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.6" stroke-linecap="round" stroke-linejoin="round"><rect x="6" y="10" width="12" height="9" rx="1.5"/><path d="M9 10V7a3 3 0 0 1 6 0v3"/></svg>
      </button>
      <button class="synav-item is-locked" disabled>
        <svg class="icon" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round"><path d="M5 20V6a2 2 0 0 1 2-2h7l5 5v11a2 2 0 0 1-2 2H7a2 2 0 0 1-2-2z"/><path d="M9 12h6M9 16h6"/></svg>
        <span class="label">Notes &amp; Insights</span>
        <svg class="lock" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.6" stroke-linecap="round" stroke-linejoin="round"><rect x="6" y="10" width="12" height="9" rx="1.5"/><path d="M9 10V7a3 3 0 0 1 6 0v3"/></svg>
      </button>
      <button class="synav-item">
        <svg class="icon" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round"><path d="M4 7a2 2 0 0 1 2-2h4l2 2h6a2 2 0 0 1 2 2v8a2 2 0 0 1-2 2H6a2 2 0 0 1-2-2z"/></svg>
        <span class="label">Homework</span>
        <span class="pub tag">Public</span>
      </button>
    </nav>

    <div class="synav-foot">
      <button class="synav-signin button">Sign in</button>
    </div>
  </div>
</div>

services:
  db:
    image: pgvector/pgvector:pg16
    environment:
      POSTGRES_USER: studykit
      POSTGRES_PASSWORD: studykit
      POSTGRES_DB: studykit
    ports:
      - "5433:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data
      - ./docker/init-pgvector.sql:/docker-entrypoint-initdb.d/init-pgvector.sql:ro
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U studykit"]
      interval: 2s
      timeout: 3s
      retries: 20

volumes:
  pgdata:

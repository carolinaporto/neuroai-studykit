# topics.yaml — vocabulário controlado de tópicos do GENED 1201
#
# Para que serve:
#   1. O gerador (M3) só pode etiquetar um Item com slugs que existam aqui.
#      Sem isso você termina com "backprop", "back-propagation" e "gradient descent"
#      como três tópicos distintos, e o painel de fraquezas vira ruído.
#   2. O painel de progresso (M10) agrega acerto por `slug`, por `unit` e por `side`.
#
# O campo `side` é o que faz este arquivo valer a pena. O objetivo declarado do curso é
# comparação entre os dois campos, então cada tópico é marcado como:
#   neuro  — achado ou conceito da neurociência/ciência cognitiva
#   ai     — mecanismo ou conceito de ML/IA
#   bridge — o conceito que existe para conectar os dois, ou a comparação em si
# Com isso o painel responde "eu entendo inferência hierárquica do lado da IA mas não do
# lado do cérebro?" — que é exatamente a fluência que o curso cobra na prova.
#
# Convenções:
#   - `slug`: kebab-case, estável. NUNCA renomeie um slug já usado por Items existentes;
#     aposente-o com `deprecated: true` e crie outro.
#   - `aliases`: variantes que o gerador pode ter escrito. Servem para normalizar na
#     validação, não para virar tópico novo.
#   - O syllabus avisa "subject to change a little": quando uma aula trouxer um conceito
#     que não está aqui, ADICIONE antes de gerar as questões daquela semana.
#   - O gerador pode devolver um campo `proposed_topics` com termos que não encontrou no
#     vocabulário. Isso NÃO entra no banco — aparece na revisão (M6) para você decidir se
#     vira tópico oficial. É assim que o vocabulário cresce sem virar bagunça.
#
# `week` é a semana prevista; ajuste conforme o curso andar. A ordem das unidades segue o
# syllabus: de "o que é inteligência" até as consequências sociais.

version: 1


[project]
name = "neuroai-studykit"
version = "0.1.0"
description = "Practice testing app for GENED 1201, anchored in course source material."
requires-python = ">=3.12"
dependencies = [
    "alembic>=1.19.2",
    "asyncpg>=0.31.0",
    "fastapi>=0.141.1",
    "pydantic>=2.13.5",
    "pydantic-settings>=2.15.0",
    "pymupdf>=1.24",
    "python-pptx>=1.0.2",
    "sqlalchemy[asyncio]>=2.0.52",
    "uvicorn[standard]>=0.52.4",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

# packages/ingest is installed in editable mode as the top-level "ingest" package so it
# stays importable on its own (invariant 4) and `python -m ingest.cli` works from repo root.
[tool.hatch.build.targets.wheel]
packages = ["packages/ingest"]

[tool.ruff]
line-length = 100
target-version = "py312"

[tool.ruff.lint]
select = ["E", "F", "I", "UP"]

[tool.ruff.lint.per-file-ignores]
# Alembic autogenerates these; long `sa.Column(...)` lines aren't worth hand-wrapping.
"alembic/versions/*" = ["E501"]

[tool.pytest.ini_options]
pythonpath = ["."]
asyncio_mode = "auto"
testpaths = ["tests"]

[dependency-groups]
dev = [
    "httpx>=0.28.1",
    "pytest>=9.1.1",
    "pytest-asyncio>=1.4.0",
    "ruff>=0.16.7",
]
